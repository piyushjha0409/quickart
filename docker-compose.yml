# write the db config here
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: quickcart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: quickcart
      POSTGRES_PASSWORD: quickcart
      POSTGRES_DB: quickcart
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickcart -d quickcart"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

# write the db config here
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: quickart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: quickart
      POSTGRES_PASSWORD: quickart
      POSTGRES_DB: quickart
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickart -d quickart"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
